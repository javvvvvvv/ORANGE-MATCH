# GitHub Actions CI/CD para Orange Match
# ============================================================================
# Pipeline automatizado para:
# - Tests en cada push/PR
# - Build y validación
# - Deploy automático a producción (solo en main)
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ==========================================================================
  # JOB 1: Tests Unitarios e Integración
  # ==========================================================================
  test:
    name: 🧪 Tests & Calidad de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Instalar dependencias backend
        run: |
          cd backend
          npm ci
      
      - name: Instalar dependencias frontend
        run: |
          cd frontend
          npm ci
      
      - name: Ejecutar linter
        run: |
          cd backend
          npm run lint || true  # No fallar el build por linting
      
      - name: Ejecutar tests unitarios con cobertura
        run: |
          cd backend
          npm run test -- --coverage
      
      - name: Subir reporte de cobertura a Codecov (opcional)
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false

  # ==========================================================================
  # JOB 2: Build y Validación
  # ==========================================================================
  build:
    name: 🏗️ Build & Validación
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Instalar dependencias backend
        run: |
          cd backend
          npm ci
      
      - name: Instalar dependencias frontend
        run: |
          cd frontend
          npm ci
      
      - name: Build del frontend
        run: |
          cd frontend
          npm run build
      
      - name: Verificar estructura de build
        run: |
          ls -la frontend/dist/
          test -f frontend/dist/index.html || exit 1
      
      - name: Crear artifact del build
        uses: actions/upload-artifact@v4
        with:
          name: orange-match-build
          path: |
            backend/
            frontend/dist/
          retention-days: 7

  # ==========================================================================
  # JOB 3: Build de Imagen Docker (solo en main)
  # ==========================================================================
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login a Docker Hub (si tienes cuenta)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Build de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false  # Cambiar a true si quieres subir a Docker Hub
          tags: orange-match:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Guardar imagen como artifact
        run: |
          docker save orange-match:${{ github.sha }} > orange-match.tar
          gzip orange-match.tar
      
      - name: Subir imagen Docker
        uses: actions/upload-artifact@v4
        with:
          name: orange-match-docker-image
          path: orange-match.tar.gz
          retention-days: 7

  # ==========================================================================
  # JOB 4: Deploy a Producción (solo en main, requiere aprobación manual)
  # ==========================================================================
  deploy:
    name: 🚀 Deploy a Producción
    runs-on: ubuntu-latest
    needs: [test, build, docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://tudominio.com  # Cambiar a tu dominio real
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Descargar build
        uses: actions/download-artifact@v4
        with:
          name: orange-match-build
          path: ./deploy-package
      
      - name: Notificar inicio de deploy (Slack/Email opcional)
        run: |
          echo "🚀 Iniciando deploy de Orange Match v${{ github.sha }}"
          echo "Commit: ${{ github.event.head_commit.message }}"
          echo "Author: ${{ github.actor }}"
      
      # Aquí iría el deploy real a tu servidor
      # Opciones comunes:
      # 1. SSH al servidor y docker compose up -d
      # 2. Deploy a Kubernetes cluster
      # 3. Deploy a AWS/GCP/Azure
      # 4. Webhook a servicio de CI/CD externo
      
      - name: Deploy vía SSH (ejemplo - requiere configurar secrets)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/orange-match
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker system prune -f
        continue-on-error: true
        if: ${{ secrets.PROD_SERVER_HOST != '' }}
      
      - name: Health check post-deploy
        run: |
          echo "⏳ Esperando 30s para que el servicio arranque..."
          sleep 30
          # Aquí podrías hacer un curl a tu endpoint de health
          echo "✅ Deploy completado"
      
      - name: Notificar éxito del deploy
        run: |
          echo "✅ Orange Match desplegado exitosamente en producción"
          echo "SHA: ${{ github.sha }}"
          echo "URL: https://tudominio.com"

# ============================================================================
# SECRETS REQUERIDOS (Configurar en GitHub Repo Settings > Secrets):
# ============================================================================
# DOCKER_USERNAME     - Tu usuario de Docker Hub (opcional)
# DOCKER_PASSWORD     - Tu password/token de Docker Hub (opcional)
# PROD_SERVER_HOST    - IP o dominio del servidor de producción
# PROD_SERVER_USER    - Usuario SSH del servidor
# PROD_SERVER_SSH_KEY - Llave privada SSH para deploy
# ============================================================================
