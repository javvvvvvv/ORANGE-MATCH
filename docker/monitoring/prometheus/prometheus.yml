global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'orange-match'

scrape_configs:
  - job_name: 'orange-match-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  - job_name: 'nodejs'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
