groups:
  - name: orange_match_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      - alert: QueueBacklog
        expr: bull_queue_waiting_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog detected"
          description: "Queue {{ $labels.queue }} has {{ $value }} waiting jobs"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis instance down"
          description: "Redis instance {{ $labels.instance }} is not responding"

      - alert: DatabaseLocked
        expr: sqlite_database_locked_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database lock detected"
          description: "SQLite database experiencing locks"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Process using {{ $value }} MB of memory"

      - alert: BackupFailed
        expr: backup_failures_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backup operation failed"
          description: "Backup job has failed {{ $value }} times"

      - alert: ExportJobFailed
        expr: export_failures_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Export job failed"
          description: "Export job has failed {{ $value }} times"
